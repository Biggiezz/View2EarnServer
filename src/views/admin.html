<body>

  <!-- Login Overlay -->
  <div class="login-overlay" id="loginOverlay">
    <div class="login-card">
      <div class="login-logo">V</div>
      <h2>View2Earn Admin</h2>
      <p>Đăng nhập để truy cập bảng điều khiển</p>
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="login-field">
          <label for="loginUsername">Tên đăng nhập</label>
          <input type="text" id="loginUsername" placeholder="Nhập tên đăng nhập" autocomplete="username" required>
        </div>
        <div class="login-field">
          <label for="loginPassword">Mật khẩu</label>
          <input type="password" id="loginPassword" placeholder="Nhập mật khẩu" autocomplete="current-password" required>
        </div>
        <button type="submit" class="login-btn">Đăng nhập</button>
        <div class="login-error" id="loginError">Sai tên đăng nhập hoặc mật khẩu</div>
      </form>
    </div>
  </div>
